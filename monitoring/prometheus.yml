# /etc/prometheus/prometheus.yml on prometheus-container (Guide 3, step 4-5)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/soa_alerts.yml

# Route fired alerts to Alertmanager (:9093) so its inhibition rules can collapse
# a fault cascade to its root cause (see monitoring/alertmanager.yml).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Step 4: liveness + application metrics of the SOA services
  - job_name: 'soa-health'
    scrape_interval: 5s
    scrape_timeout: 4s
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['10.255.255.204:8000']

  # Step 5: CPU / memory / network / processes of EVERY Incus container,
  # from Incus' built-in metrics endpoint (core.metrics_address on the VM).
  # Per-container numbers are what let you pin a problem on one container (step 6).
  - job_name: 'incus'
    scrape_interval: 10s
    metrics_path: '/1.0/metrics'
    scheme: 'https'
    tls_config:
      cert_file: /etc/prometheus/incus-metrics.crt
      key_file: /etc/prometheus/incus-metrics.key
      insecure_skip_verify: true
    static_configs:
      - targets: ['10.255.255.1:8444']

  # Extra: node exporter inside soa-container (filesystem, sockets, ...).
  # Its CPU numbers are not reliable inside an LXC container; use the incus job for CPU.
  - job_name: 'soa-node'
    scrape_interval: 5s
    static_configs:
      - targets: ['10.255.255.204:9100']
