# Alerting rules shown on Prometheus' Alerts page (Guide 3, step 5-6)
groups:
  - name: soa
    rules:
      - alert: ServiceDown
        expr: service_health == 0
        for: 15s
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.service_id }} is not answering /health"

      - alert: RegistryDown
        expr: registry_up == 0 or absent(registry_up)
        for: 15s
        labels: {severity: critical}
        annotations:
          summary: "Service registry is unreachable"

      - alert: HighRequestRate
        expr: rate(service_requests_total[1m]) > 20
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.service }} is receiving {{ $value | humanize }} req/s (normal is < 2)"

      - alert: HighLatency
        expr: service_health_latency_seconds > 0.5
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.service_id }} /health takes {{ $value | humanizeDuration }}"

      - alert: HighErrorRatio
        expr: rate(service_errors_total[1m]) / rate(service_requests_total[1m]) > 0.2
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.service }}: {{ $value | humanizePercentage }} of requests fail"

      - alert: ContainerHighCPU
        # CPU cores used by each container (1.0 = one full core)
        expr: sum by (name) (rate(incus_cpu_seconds_total{mode=~"user|system"}[1m])) > 0.8
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.name }} is using {{ $value | humanize }} CPU cores"

      - alert: ContainerHighNetworkIn
        expr: rate(incus_network_receive_bytes_total{device="eth0"}[1m]) > 1e6
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.name }} receives {{ $value | humanize1024 }}B/s"

      - alert: ContainerHighNetworkOut
        expr: rate(incus_network_transmit_bytes_total{device="eth0"}[1m]) > 1e6
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.name }} sends {{ $value | humanize1024 }}B/s"

  # --- Threat 1 (DoS/DDoS): availability / quality-of-service ---------------
  # Measured healthy baseline (no attacker): analytics request latency ~0.015 s,
  # /health probe latency ~0.005 s, request rate < 0.2 req/s, soa-container < 0.1 CPU core.
  #
  # Alert window  : `for: 30s` — the degradation must be SUSTAINED, so a single
  #                 expensive request or a brief flash-crowd spike does not page.
  # Recovery      : Prometheus auto-resolves when the expression is false again;
  #                 with for:30s the alert clears ~30-60 s after latency returns
  #                 to baseline. Trade-off: a longer window = fewer false positives
  #                 from benign flash crowds but a slower detection (here ~30 s).
  - name: soa_qos
    rules:
      - alert: QoSDegraded_AnalyticsLatency
        # Real-time signal: the exporter probes /health every 5 s. /health is cheap,
        # so it only gets slow when workers/sockets are saturated — i.e. real QoS loss,
        # not merely a slow single request. Baseline ~0.005 s; alert > 10x sustained.
        expr: max(service_health_latency_seconds{service="analytics-service"}) > 0.05
        for: 30s
        labels: {severity: critical, threat: dos}
        annotations:
          summary: "analytics /health latency {{ $value | humanizeDuration }} (baseline ~5ms) — availability degraded"

      - alert: DoS_RequestFlood
        # Correlates with the latency alert to separate a real flood from a slow backend
        expr: sum by (service) (rate(service_requests_total[1m])) > 10
        for: 30s
        labels: {severity: critical, threat: dos}
        annotations:
          summary: "{{ $labels.service }} flooded at {{ $value | humanize }} req/s (baseline < 0.2)"

      - alert: DoS_TargetCPUSaturated
        expr: sum by (name) (rate(incus_cpu_seconds_total{name="soa-container",mode=~"user|system"}[1m])) > 0.8
        for: 30s
        labels: {severity: warning, threat: dos}
        annotations:
          summary: "soa-container CPU saturated at {{ $value | humanize }} cores — resource exhaustion"
