<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13">
  <rect x="0" y="0" width="980" height="650" fill="#ffffff"/>
  <text x="490" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1a202c">Project 1 — Managed service architecture with dual-plane detection &amp; response</text>
  <text x="490" y="50" text-anchor="middle" font-size="12" fill="#4a5568">Isolated Incus bridge incus-default 10.255.255.0/24 (inside the 8 GB VM)</text>

  <!-- ===================== Managed system (SOA) ===================== -->
  <rect x="25" y="70" width="545" height="300" rx="10" fill="#f0f6fd" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="40" y="92" font-size="14" font-weight="700" fill="#2b6cb0">Managed system — Temperature SOA</text>
  <text x="40" y="109" font-size="11" fill="#4a5568">soa-container 10.255.255.204 · 1 systemd unit per component · hierarchical IDs</text>
  <text x="40" y="124" font-size="10.5" fill="#718096">country.region.dc.rack.node / kind#instance → management-by-location + discovery + addressing</text>

  <!-- pipeline -->
  <rect x="45" y="150" width="86" height="40" rx="6" fill="#d9e8fa" stroke="#2b6cb0"/>
  <text x="88" y="175" text-anchor="middle">sensor</text>

  <rect x="160" y="150" width="120" height="40" rx="6" fill="#d9e8fa" stroke="#2b6cb0"/>
  <text x="220" y="170" text-anchor="middle">ingestion</text>
  <text x="220" y="184" text-anchor="middle" font-size="11" fill="#c05621" font-weight="700">:5001 ⚠</text>

  <rect x="320" y="142" width="118" height="34" rx="6" fill="#d9e8fa" stroke="#2b6cb0"/>
  <text x="379" y="163" text-anchor="middle" font-size="12">storage A :5002</text>
  <rect x="320" y="182" width="118" height="34" rx="6" fill="#d9e8fa" stroke="#2b6cb0"/>
  <text x="379" y="203" text-anchor="middle" font-size="12">storage B :5012</text>

  <rect x="470" y="150" width="82" height="40" rx="6" fill="#d9e8fa" stroke="#2b6cb0"/>
  <text x="511" y="170" text-anchor="middle">analytics</text>
  <text x="511" y="184" text-anchor="middle" font-size="11" fill="#c05621" font-weight="700">:5003 ⚠</text>

  <rect x="160" y="250" width="278" height="44" rx="6" fill="#e4eefb" stroke="#2b6cb0" stroke-dasharray="4 3"/>
  <text x="299" y="270" text-anchor="middle" font-size="12">Service Registry :5050 (localhost)</text>
  <text x="299" y="285" text-anchor="middle" font-size="10.5" fill="#718096">round-robin, location-aware LB · health TTL + probe</text>

  <!-- pipeline arrows -->
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2b6cb0"/></marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#c53030"/></marker>
    <marker id="arG" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2f855a"/></marker>
  </defs>
  <line x1="131" y1="170" x2="156" y2="170" stroke="#2b6cb0" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="280" y1="165" x2="316" y2="159" stroke="#2b6cb0" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="280" y1="175" x2="316" y2="199" stroke="#2b6cb0" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="470" y1="170" x2="442" y2="170" stroke="#2b6cb0" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="455" y="137" text-anchor="middle" font-size="10" fill="#718096">reads</text>
  <line x1="220" y1="250" x2="220" y2="192" stroke="#2b6cb0" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#ar)"/>
  <line x1="470" y1="265" x2="438" y2="265" stroke="#2b6cb0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="470" y1="265" x2="470" y2="192" stroke="#2b6cb0" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#ar)"/>
  <text x="300" y="330" text-anchor="middle" font-size="10.5" fill="#718096">⚠ = externally reachable attack surface · registry + storage bound to localhost</text>

  <!-- ===================== Prometheus plane ===================== -->
  <rect x="595" y="70" width="360" height="135" rx="10" fill="#fff6ec" stroke="#c05621" stroke-width="1.5"/>
  <text x="610" y="92" font-size="14" font-weight="700" fill="#c05621">Prometheus — performance / availability</text>
  <text x="610" y="109" font-size="11" fill="#4a5568">prometheus-container 10.255.255.153</text>
  <text x="610" y="129" font-size="11.5" fill="#2d3748">• scrape health exporter :8000 (per-instance, latency)</text>
  <text x="610" y="147" font-size="11.5" fill="#2d3748">• scrape Incus metrics :8444 (CPU / mem / net)</text>
  <text x="610" y="165" font-size="11.5" fill="#2d3748">• node exporter :9100</text>
  <text x="610" y="189" font-size="11.5" fill="#2d3748" font-weight="600">alert groups: soa · soa_qos (flood / latency / CPU)</text>

  <!-- scrape arrow -->
  <line x1="595" y1="135" x2="555" y2="165" stroke="#c05621" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arR)"/>
  <text x="577" y="128" text-anchor="middle" font-size="10" fill="#c05621">scrape</text>

  <!-- ===================== Wazuh plane ===================== -->
  <rect x="595" y="220" width="360" height="150" rx="10" fill="#eef2f7" stroke="#2c5282" stroke-width="1.5"/>
  <text x="610" y="242" font-size="14" font-weight="700" fill="#2c5282">Wazuh SIEM — security</text>
  <text x="610" y="259" font-size="11" fill="#4a5568">wazuh-container 10.255.255.4 · agents on targets</text>
  <text x="610" y="280" font-size="11.5" fill="#2d3748">• decoders + rules: DoS 100110 · spam 100201-3 · C2 100300/1</text>
  <text x="610" y="298" font-size="11.5" fill="#2d3748">• FIM (syscheck) · command / socket monitoring</text>
  <text x="610" y="316" font-size="11.5" fill="#2f855a" font-weight="600">active-response: firewall-drop · c2-contain · quarantine</text>
  <text x="610" y="340" font-size="10.5" fill="#718096">correlate Prometheus symptom + Wazuh event → root cause</text>

  <!-- ===================== Targets / threats band ===================== -->
  <rect x="25" y="400" width="930" height="225" rx="10" fill="#fafafa" stroke="#cbd5e0" stroke-width="1.2"/>
  <text x="40" y="422" font-size="13" font-weight="700" fill="#4a5568">Targets &amp; threats (each brought up per-PoC via lab/control.sh — RAM-aware)</text>

  <!-- target containers -->
  <rect x="45" y="440" width="150" height="46" rx="6" fill="#edf2f7" stroke="#4a5568"/>
  <text x="120" y="460" text-anchor="middle" font-size="12">apache-container</text>
  <text x="120" y="476" text-anchor="middle" font-size="11" fill="#718096">.241 :80 (agent)</text>

  <rect x="215" y="440" width="150" height="46" rx="6" fill="#edf2f7" stroke="#4a5568"/>
  <text x="290" y="460" text-anchor="middle" font-size="12">mail-container</text>
  <text x="290" y="476" text-anchor="middle" font-size="11" fill="#718096">.206 :25 (agent)</text>

  <rect x="385" y="440" width="150" height="46" rx="6" fill="#fdecea" stroke="#c53030"/>
  <text x="460" y="460" text-anchor="middle" font-size="12">metasploit (C2)</text>
  <text x="460" y="476" text-anchor="middle" font-size="11" fill="#718096">.81 :4444</text>

  <rect x="555" y="440" width="180" height="46" rx="6" fill="#edf2f7" stroke="#4a5568"/>
  <text x="645" y="460" text-anchor="middle" font-size="12">load-client-a / -b</text>
  <text x="645" y="476" text-anchor="middle" font-size="11" fill="#718096">.211 / .212 (ApacheBench)</text>

  <rect x="755" y="440" width="180" height="46" rx="6" fill="#edf2f7" stroke="#4a5568"/>
  <text x="845" y="460" text-anchor="middle" font-size="12">mitm-interceptor</text>
  <text x="845" y="476" text-anchor="middle" font-size="11" fill="#718096">.227 + mitm-net 10.66.0.0/24</text>

  <!-- threat rows -->
  <g font-size="12">
    <circle cx="52" cy="512" r="5" fill="#c53030"/>
    <text x="64" y="516" fill="#2d3748"><tspan font-weight="700" fill="#c53030">A · DDoS</tspan>  — flood analytics :5003 / Apache :80 → QoS alerts + rule 100110 → rate-limit + firewall-drop</text>

    <circle cx="52" cy="540" r="5" fill="#c53030"/>
    <text x="64" y="544" fill="#2d3748"><tspan font-weight="700" fill="#c53030">B · Spam</tspan>   — SMTP :25 → SpamAssassin score + rules 100201-3 → quarantine (HOLD) + SMTP rate-limit</text>

    <circle cx="52" cy="568" r="5" fill="#c53030"/>
    <text x="64" y="572" fill="#2d3748"><tspan font-weight="700" fill="#c53030">C · C2/APT</tspan> — reverse shell apache→.81:4444 → FIM 100301 + socket 100300 → c2-contain (kill + block egress)</text>

    <circle cx="52" cy="596" r="5" fill="#c53030"/>
    <text x="64" y="600" fill="#2d3748"><tspan font-weight="700" fill="#c53030">D · MitM</tspan>   — hijacked route via interceptor → extra-hop / TTL=63 detection → TLS + cert pinning (bonus)</text>
  </g>
</svg>
